[versions]
# Kotlin
kotlin = "2.4.20"                  # https://github.com/JetBrains/kotlin/

# Testing - JUnit6
junit-bom = "6.1.3"                # https://github.com/junit-team/junit-framework/releases
junit-legacy = "4.13.2"            # https://junit.org/junit4/

# KtLint
ktlint-core = "1.8.0"              # https://github.com/ktlint/ktlint

# Gradle plugins
ktlint-gradle = "14.2.0"           # https://github.com/JLLeitschuh/ktlint-gradle
intellij-platform = "2.19.0"       # https://github.com/JetBrains/intellij-platform-gradle-plugin

# IDE versions: 242 = IntelliJ IDEA 2024.2 / Android Studio Ladybug 2024.2.1
sinceBuildIdea = "242"             # https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
platformIdea = "2024.2.6"          # IDE the plugin is compiled against: the oldest supported one
oldestAndroidStudio = "2024.2.1.9" # https://plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html

jvmToolchain = "25"                # https://docs.oracle.com/en/java/javase/25/
jvmTarget = "21"                   # https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html#platformVersions

[libraries]
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-bom" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit-bom" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-bom" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-bom" }

junit-legacy = { group = "junit", name = "junit", version.ref = "junit-legacy" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

ktlint-gradle-plugin = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
